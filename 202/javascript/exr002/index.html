<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Meu controle de gastos</h1>
        <section class="saldo">
            <p>Saldo Disponível</p>
            <h2 id="saldo">R$500,00</h2>
        </section>
        <section class="formulario">
            <input type="text" id="descricao" placeholder="Descrição do gasto">
            <input type="number" id="valor" placeholder="Valor" min="0" inputmode="decimal">
            <button onclick="">Adicionar gasto</button>
        </section>
        <h3>Meus gastos</h3>

        <div id="listaGastos"></div>
        <section class="total">
            <p>Total gasto</p>
            <h2>R$0,00</h2>
        </section>
    </main>
    <script src="script.js"defer></script>
</body>
</html>
