<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>
    <script src="index.js"defer></script>
</head>
<body>
    <h1>Conversor de Moedas</h1>
    <label for="valorReais">Digite o valor em Reais:</label>
    <input type="number" id="valorReais" placeholder="R$">
    <p>Selecione a Moeda a Converter</p>
    <select name="" id="Moeda">
        <option value="Rial">Rial</option>
        <option value="Shekel">Shekel</option>
        <option value="DolarAust">Dolar Australiano</option>
    </select>
    <button id="Calcular" onclick="main()">Calcular</button>
    <p id="resposta"></p>
</body>
</html>
