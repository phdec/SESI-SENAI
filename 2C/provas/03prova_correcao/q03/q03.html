<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testar Sensores</title>
    <link rel="stylesheet" href="q03.css">
    <script src="q03.js"defer></script>
</head>
<body>
    <h1>Testar sensores</h1>
    <label for="qtde">Digite a quantidade do sorteio: </label>
    <input type="number" id="qtde" placeholder="quantidade"><br>
    <label for="min">Digite o menor valor: </label>
    <input type="number" id="min"><br>
    <label for="max">Digite o maior valor: </label>
    <input type="number" id="max"><br>

    <select id="opcao">
        <option value="b">Divisíveis por 3</option>
        <option value="m">Divisíveis por 5</option>
        <option value="a">Divisíveis por 7</option>
    </select>

    <button onclick="main()">Testar</button><br>
    <button onclick="apagar()">Apagar</button><br>

    <div id="resposta"></div>

</body>
</html>
