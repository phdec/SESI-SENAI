<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="prog04.js" defer></script>
    <style>
        body{
            display: flex;
            flex-flow: column nowrap;
            align-items: center;
            gap: 10px;
            font-family: Arial, Helvetica, sans-serif;
        }

        button{
            border-radius: 15px;
            padding: 12px 16px;
            border: none;
            background-color: black;
            color: white;
            font-weight: bold;
            transition: all 1s;
        }

        button:hover{
            background-color: rgb(26, 26, 26);
            box-shadow: 0px 1px 10px rgba(0, 0, 0, 0.185);
            cursor: pointer;
        }

        table {
            border-collapse: collapse;
        }

        thead{
            background-color: lightgrey;
        }

        th, td {
            border: 1px solid black;
            padding: 5px;
            text-align: center;
        }
    </style>
    <title>simulado_array</title>
</head>

<body>
    <h1>Simulado - Arrays</h1>
    <p>Gere 20 níveis de poluição aleatórios (entre 1 e 100), classifique cada valor como: Baixo (1 a 35), Moderado (36 a 60) e Alto (61 a 100).</p>
    <button id="gerar">Gerar</button>
    <div id="result"></div>
</body>

</html>
